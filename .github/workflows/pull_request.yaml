---
name: Validate Pull Request Changes

on:
  pull_request:
    branches:
      - main
    paths:
      - eks/**

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #required for oidc auth
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          
      - name: Setup TFenv
        uses: skillupwithsachin/actions/setup-tfenv@main

      - name: Setup tgenv
        uses: skillupwithsachin/actions/setup-tgenv@main

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Run Terragrunt Plan
        working-directory: environments/dev/skillupwithsachin-eks-demo
        run: |
          terragrunt init
          terragrunt plan --terragrunt-non-interactive
      
      - name: Cleanup
        run: |
          rm -rf .terraform .terragrunt-cache
      
